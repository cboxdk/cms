# The containerized CI run of the PR profile (GUARDRAILS 10):
#
#   docker compose -f compose.ci.yaml run --rm ci
#   docker compose -f compose.ci.yaml down      # stops postgres and valkey afterwards
#
# CMS_CI_BASE_REF is the base of the change, such as main or HEAD~3, for mutation on changed files
# in gate 5; ci.yml sets it to the pull request's base commit. It is optional here:
# CMS_CI_BASE_REF=HEAD~3 docker compose -f compose.ci.yaml run --rm ci. docker/ci-entry.sh
# resolves it in the mounted .git and builds the archive as two commits, the merge base's tree and
# HEAD's, with CMS_CI_BASE_REF=HEAD~1 inside. Unset or empty, the script derives the base in the
# mounted .git as bin/ci does: HEAD~1 when HEAD is main, and the merge base with origin/main, or
# main without a remote, on another branch.
#
# bin/ci runs every part of ci.yml's jobs one after the other (CMS_CI_PART=all): the plan of the
# shards of mutation on changed files, the gates, each shard, and the verdict over them, and times
# each part against the budget, because ci.yml runs them as parallel jobs. One part runs alone with
# CMS_CI_PART, such as CMS_CI_PART=shard:3/12 or CMS_CI_PART=gates.
#
# The ci service runs the two steps .github/workflows/ci.yml runs after its checkout,
# docker/ci-setup.sh and bin/ci, on a clean git archive of HEAD: the repository's .git is mounted
# read-only and docker/ci-entry.sh exports HEAD and runs both from it, so uncommitted and untracked
# files never reach the run. Commit first. The image is docker/ci.Dockerfile: the PHP 8.5 base
# image of the v1 channel, the job container of ci.yml, with only the entry point added. The setup
# installs psql and verifies the Chromium of the pinned Playwright, or installs it, as in ci.yml.
# postgres and valkey are the services of compose.yaml without host ports, so the run works next
# to the dev services, and with their data on tmpfs, so every run starts empty. Their volumes are
# replaced, not merged: postgres mounts nothing from the working tree, neither the init script nor
# the conf.d drop-in, as a service of ci.yml, which starts before the checkout, cannot either.
# bin/ci creates the roles and databases over TCP from HEAD's archive, as in ci.yml, and
# max_prepared_transactions is Postgres' default, 0.
#
# Declared runner: GitHub-hosted ubuntu-latest, 4 vCPU and 16 GB RAM (the standard Linux runner
# for public repositories; a private repository gets 2 vCPU there and needs a 4-core larger runner).
# This run on Docker Desktop is the recorded proxy: ci, postgres and valkey share CPUs 0 to 3, as
# the job and its service containers share the runner's 4 vCPU. PROGRESS.md records its wall time
# against the 15-minute budget of GUARDRAILS 10.

name: laravel-cms-ci

services:
  ci:
    build:
      context: docker
      dockerfile: ci.Dockerfile
    image: laravel-cms-ci:local
    init: true
    cpuset: '0-3'
    mem_limit: 16g
    volumes:
      # CMS_CI_SOURCE_GIT runs the HEAD of another repository's .git instead.
      - ${CMS_CI_SOURCE_GIT:-./.git}:/source.git:ro
    environment:
      CI: 'true'
      CMS_CI_RUNNER: 'Docker Desktop, 4 CPUs, as the proxy for ubuntu-latest, 4 vCPU'
      # The base of the change from the host's environment; empty counts as unset.
      CMS_CI_BASE_REF: ${CMS_CI_BASE_REF:-}
      # The part of bin/ci to run from the host's environment; empty runs every part.
      CMS_CI_PART: ${CMS_CI_PART:-}
      CMS_CI_PROVISION_POSTGRES: '1'
      CMS_CI_USER: ci
      DB_HOST: postgres
      DB_PORT: '5432'
      REDIS_HOST: valkey
      REDIS_PORT: '6379'
      XDEBUG_MODE: 'off'
      # The superuser and the roles of compose.yaml's postgres service; tests/Feature/Tooling/Ci
      # keeps them equal. Development credentials only. Never POSTGRES_* here: Testbench copies
      # those into the pgsql connection, and the tests would run as the superuser.
      CMS_CI_POSTGRES_SUPERUSER: postgres
      CMS_CI_POSTGRES_PASSWORD: postgres
      CMS_DATABASES: cms cms_test
      CMS_SCHEMA: cms
      CMS_OWNER_ROLE: cms_owner
      CMS_OWNER_PASSWORD: cms_owner
      CMS_APP_ROLE: cms_app
      CMS_APP_PASSWORD: cms_app
      CMS_APP_TRANSACTION_TIMEOUT: 5s
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy

  postgres:
    extends:
      file: compose.yaml
      service: postgres
    ports: !reset []
    cpuset: '0-3'
    # The data mount of ghcr.io/cboxdk/postgres; the cluster is created in 18/docker below it.
    volumes: !override
      - type: tmpfs
        target: /var/lib/postgresql

  valkey:
    extends:
      file: compose.yaml
      service: valkey
    ports: !reset []
    cpuset: '0-3'
    volumes: !override
      - type: tmpfs
        target: /data
