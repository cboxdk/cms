# yaml-language-server: $schema=../../../../../../contracts/resources/schemas/blueprint.v1.json
# The comprehensive example type of the type chain (PRD 11.12, MILESTONES M1 point 1): a type of
# the module shop that uses all ten core field types, select options, a group with nested fields
# once and repeated, required, filterable and sortable fields, every classification and both agents
# flags. The app extends it in ../app/product.yaml. TypeDescriptorTest compiles both and compares the
# descriptor with ../descriptor.json. The presentation keys (gap G2) reach only the editor
# descriptor, ../editor.json: a label per locale, a layout of two tabs and a sidebar, which the
# app's fragment joins, the ui hints of a select and of a repeated group, and form-only defaults.
# Two fields are conditional (gap G3): support_email is shown unless the product is discontinued
# and is cleared when it is hidden, and a dimension's width is required while its size is large
# and the product says whether it is discontinued, reading its group's sibling with ../, and keeps
# its value when it is hidden.
blueprint: 1
kind: type
type_id: 0198d2a4-5c3e-7a41-9b2f-3c8e1f6a7d20
handle: product
label:
  en: Product
  da: Produkt
description: A product of the shop, with its price, stock and supplier.
version: 3
capabilities:
  history: full
  stages: draft-release
  localization: none
  routable: true
fields:
  - handle: name
    label:
      en: Name
      da: Navn
    description: The name of the product, as the shop shows it.
    type: text
    required: true
    classification: public
    filterable: true
    sortable: true
    min_length: 1
    max_length: 120
    ui:
      input_hint: The name on the shelf
  - handle: support_email
    label: Support email
    description: Where customers write about the product.
    type: text
    classification: public
    format: email
    when:
      field: discontinued
      neq: true
    when_hidden: clear
  - handle: summary
    label: Summary
    type: long_text
    classification: internal
    agents: false
    max_length: 2000
  - handle: stock
    label: Stock
    description: How many items the warehouse holds.
    type: integer
    classification: internal
    filterable: true
    sortable: true
    min: 0
    max: 1000000
    unit: pcs
    default: 0
  - handle: weight
    label: Weight
    description: The weight of one item in grams.
    type: integer
    classification: public
    min: 1
  - handle: price
    label: Price
    description: The price of one item, in euro.
    type: decimal
    required: true
    classification: public
    sortable: true
    precision: 10
    scale: 2
    min: "0.00"
    max: "99999999.99"
    unit: EUR
    default: "0.00"
  - handle: discontinued
    label: Discontinued
    description: Whether the shop no longer sells the product.
    type: boolean
    classification: public
    filterable: true
    default: false
  - handle: launch_date
    label: Launch date
    description: The day the product went on sale.
    type: date
    classification: public
    sortable: true
    min: "2000-01-01"
    max: "2099-12-31"
    default: today
  - handle: checked_at
    label: Checked at
    description: When the product data was last checked.
    type: datetime
    classification: internal
    min: "2000-01-01T00:00:00Z"
    default: now
    ui:
      read_only: true
  - handle: colour
    label: Colour
    description: The colour of the product.
    type: select
    required: true
    classification: public
    filterable: true
    default: red
    ui:
      display: radio
      instructions:
        en: Pick the colour of the product.
        da: Vælg produktets farve.
    options:
      - value: red
        label:
          en: Red
          da: Rød
      - value: green
        label: Green
      - value: blue
        label: Blue
  - handle: tags
    label: Tags
    description: The tags the shop lists the product under.
    type: select
    classification: public
    multiple: true
    min_items: 1
    max_items: 3
    default: [new]
    options:
      - value: new
        label: New
      - value: sale
        label: Sale
      - value: eco
        label: Eco
  - handle: body
    label: Body
    description: The description of the product on its page.
    type: rich_text
    classification: public
    styles: [normal, h2, h3]
    marks: [strong, em]
    lists: [bullet]
    links: [url]
  - handle: care
    label: Care
    description: How to take care of the product.
    type: rich_text
    classification: public
  - handle: supplier
    label: Supplier
    description: Who supplies the product, and how to reach them.
    type: group
    classification: confidential
    agents: true
    fields:
      - handle: company
        label: Company
        description: The name of the supplier.
        type: text
        required: true
      - handle: website
        label: Website
        description: The supplier's website.
        type: text
        format: url
      - handle: notes
        label: Notes
        type: long_text
        agents: false
  - handle: dimensions
    label: Dimensions
    description: The sizes the product comes in.
    type: group
    classification: public
    repeat:
      min_items: 1
      max_items: 5
    ui:
      summary: "{size}: {width} mm"
    fields:
      - handle: size
        label: Size
        description: The name of the size.
        type: select
        required: true
        options:
          - value: small
            label: Small
          - value: large
            label: Large
      - handle: width
        label: Width
        description: The width in millimetres.
        type: integer
        required: true
        min: 1
        when:
          all:
            - field: size
              eq: large
            - field: ../discontinued
              not_null: true
        when_hidden: keep
  - handle: purchase_price
    label: Purchase price
    description: What the shop pays the supplier for one item.
    type: decimal
    classification: confidential
    precision: 10
    scale: 2
    ui:
      hidden: true
layout:
  tabs:
    - handle: general
      label:
        en: General
        da: Generelt
      sections:
        - handle: identity
          fields:
            - field: name
              width: two_thirds
            - field: colour
              width: third
            - field: summary
            - field: body
            - field: care
        - handle: supply
          label: Supply
          instructions: Who supplies the product and what it costs.
          collapsible: true
          fields:
            - field: supplier
            - field: purchase_price
              width: half
            - field: stock
              width: half
    - handle: details
      label: Details
      sections:
        - handle: measures
          fields:
            - field: weight
              width: half
            - field: price
              width: half
            - field: dimensions
  sidebar:
    sections:
      - handle: status
        label: Status
        fields:
          - field: discontinued
          - field: launch_date
          - field: checked_at
          - field: tags
      - handle: contact
        label: Contact
        fields:
          - field: support_email
