; PCOV for mutation on changed files, the PR profile's step in gate 5 (tools/src/Mutation).
;
; The PHP image loads PCOV but leaves it off (pcov.enabled=0) and points it at /var/www/html. The
; step sets PHP_INI_SCAN_DIR=:tools/mutation, so the Pest run and every process it starts in the
; checkout, the parallel workers and the runs of single mutations, read this file after the
; image's. pcov.directory=/ lets it collect wherever the checkout is, such as /work in
; compose.ci.yaml, and pcov.exclude keeps collection to packages/<package>/src, the code the
; step mutates.
pcov.enabled = 1
pcov.directory = /
pcov.exclude = "~^(?!.*/packages/[^/]+/src/)~"
