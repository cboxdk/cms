; PCOV for Pest's test impact analysis in `composer test:affected` (tools/bin/test-affected.php).
;
; The dev image loads PCOV but leaves it off (pcov.enabled=0) and points it at /var/www/html. The
; run of the Pest files sets PHP_INI_SCAN_DIR=:<checkout>/tools/tia, so Pest and its workers read it
; after the image's. Pest records, per test, the files it ran through PCOV; pcov.directory=/ lets it
; collect wherever the checkout is mounted, and pcov.exclude leaves out the installed dependencies,
; which Pest's graph does not track.
pcov.enabled = 1
pcov.directory = /
pcov.exclude = "~/(vendor|node_modules)/~"
