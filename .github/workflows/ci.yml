# CI for the laravel-cms monorepo: the PR profile of GUARDRAILS 10.
#
# Every step is setup, except bin/ci, the single CI entry script. bin/ci installs the locked
# dependencies and runs `composer check -- --pr`, which calls the same Composer and npm
# scripts as `composer check`: lint:check, format:check, rector:check, analyse, typecheck, lint
# and check:generated, and the Pest suites of gate 5. Gate 5 adds the Mutation suite and
# mutation on changed files: Pest's --mutate with PCOV and --min=80 on the files below
# packages/*/src changed since the merge base of CMS_CI_BASE_REF and HEAD. It also runs
# gate 8, the Browser suite, gate 9, composer audit and npm audit, and
# gate 10, composer docs:check. It reports what it did not run: gates 7 and 11, each with the
# reason, in the log and the job summary.
#
# CMS_CI_BASE_REF is the pull request's base commit, or for a push to main the commit before the
# push. The checkout fetches the whole history (fetch-depth: 0), so the merge base is there.
#
# Every action is pinned to the commit of its release tag, which the comment names; a tag can be
# moved, a commit cannot. docker/ci-setup.sh is the setup compose.ci.yaml runs too: psql, git,
# the user ci, PCOV and Chromium for the pinned Playwright.
#
# Declared runner: GitHub-hosted ubuntu-latest, 4 vCPU and 16 GB RAM, the standard Linux runner
# for public repositories. A private repository gets 2 vCPU on ubuntu-latest and needs a 4-core
# larger runner for the same shape. The budget is 15 minutes (GUARDRAILS 10). compose.ci.yaml
# runs the same bin/ci on the same image locally, and PROGRESS.md records its wall time as the proxy.

name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pr-profile:
    name: PR profile (GUARDRAILS 10)
    runs-on: ubuntu-latest
    # The PR profile's budget is 15 minutes (GUARDRAILS 10); the limit leaves room for the setup
    # and stops a hung job long before GitHub's default of six hours.
    timeout-minutes: 20
    # PHP 8.5 of the v1 channel with Node 22, the base of docker/ci.Dockerfile.
    container:
      image: ghcr.io/cboxdk/php-baseimages/php-cli:8.5-bookworm-dev-v1
    services:
      # The images of compose.yaml: the cboxdk database images, with cbox-init as PID 1. Their
      # readiness file is the health check, as in compose.yaml. A service starts before the
      # checkout, so it mounts nothing: bin/ci creates the roles and databases over TCP, and
      # max_prepared_transactions is Postgres' default, 0 (PRD 4.2), as in compose.ci.yaml.
      postgres:
        image: ghcr.io/cboxdk/postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        options: >-
          --health-cmd "test -f /tmp/cbox-ready"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
          --health-start-period 60s
      valkey:
        image: ghcr.io/cboxdk/valkey:8
        options: >-
          --health-cmd "test -f /tmp/cbox-ready"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
          --health-start-period 30s
    env:
      CMS_CI_RUNNER: 'ubuntu-latest, 4 vCPU'
      CMS_CI_BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before }}
      CMS_CI_PROVISION_POSTGRES: '1'
      CMS_CI_USER: ci
      DB_HOST: postgres
      DB_PORT: '5432'
      REDIS_HOST: valkey
      REDIS_PORT: '6379'
      XDEBUG_MODE: 'off'
      # The superuser and roles of compose.yaml. Never POSTGRES_* in the job's environment:
      # Testbench copies those into the pgsql connection, and the tests would run as the superuser.
      CMS_CI_POSTGRES_SUPERUSER: postgres
      CMS_CI_POSTGRES_PASSWORD: postgres
      CMS_DATABASES: cms cms_test
      CMS_SCHEMA: cms
      CMS_OWNER_ROLE: cms_owner
      CMS_OWNER_PASSWORD: cms_owner
      CMS_APP_ROLE: cms_app
      CMS_APP_PASSWORD: cms_app
      CMS_APP_TRANSACTION_TIMEOUT: 5s
    steps:
      - name: Check out
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # The whole history, for the merge base of CMS_CI_BASE_REF and HEAD.
          fetch-depth: 0

      - name: Set up psql, git, the user ci and Chromium, and check PCOV, as compose.ci.yaml does
        run: docker/ci-setup.sh

      - name: bin/ci
        run: bin/ci

      - name: Keep the gate report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: gate-report
          path: build/ci/
          if-no-files-found: warn
