# Development and test services for the laravel-cms monorepo.
#
# Lives here until the name of the app template is decided (see "Blokeret" in PROGRESS.md);
# then it moves to the template and this file follows it.
#
#   composer services:up      # exports CMS_UID and CMS_GID, then docker compose up -d --wait
#   composer services:down    # stops the services; the data volumes are kept
#
# Both run tools/bin/services.php, which always uses the main checkout's compose.yaml and the main
# checkout as the project directory, so the bind mounts below are the main checkout's paths. From a
# linked worktree, services:up starts only postgres and valkey with --no-recreate, and
# services:down refuses, because the services are shared.
#
# Host ports: Postgres 54317, Valkey 63797. They are fixed so the tests on the host
# (phpunit.xml) and in the php container reach the same services. They bind to 127.0.0.1 only:
# the credentials below are fixed, Valkey has no password, and a port without a host address is
# published on every interface, which Docker Desktop forwards to the LAN. The php container
# reaches the services on the compose network. ComposePortsTest fails on a port without it.
#
# Postgres and Valkey run on the cboxdk database images (PROGRESS.md, decisions), with
# cbox-init as PID 1. Its readiness file, /tmp/cbox-ready, is the health check of both: the
# supervisor writes it once the engine accepts connections, and for Postgres not while the
# first-run init scripts still run on the entrypoint's temporary, socket-only server
# (~/Projects/db-baseimages/README.md). The tests run on Postgres 18; 17 stays the minimum
# (GUARDRAILS 1.2), so code never uses what arrived in 18.
#
# Roles follow the operating contract in PRD 4.2 and GUARDRAILS 6:
#   cms_owner  owns the databases and the cms schema, runs migrations and partition maintenance
#   cms_app    the application and the tests: no DDL, NOBYPASSRLS, transaction_timeout 5s
#   cms_identity  the credential store of the local accounts, on a connection of its own: DML on
#              the schema cms_identity only, which the app role cannot read (PRD 5.16)
# The init script in docker/postgres is idempotent and runs on an empty data volume. The server
# settings, max_prepared_transactions 0, are the drop-in docker/postgres/conf.d/cms.conf.
#
# The php service runs with the PHP settings of the runtime contract from the drop-in
# docker/php/conf.d/cms.ini: allow_url_fopen = Off (GUARDRAILS 3), which cms:doctor checks as
# php.allow_url_fopen, so `docker compose exec php vendor/bin/testbench cms:doctor` needs no -d
# flag. Composer downloads through the curl extension. The CI files keep the image's default.
#
# A data volume from before the switch to Postgres 18 holds a Postgres 17 cluster in data/. The
# entrypoint then refuses to start and says so in `docker compose logs postgres`. It is test
# data: remove it with `docker compose down -v` and run `composer services:up` again.

name: laravel-cms

services:
  php:
    # The v1 release channel of php-baseimages, never the rolling tag (PROGRESS.md, decisions).
    # The dev tier has Xdebug and PCOV.
    image: ghcr.io/cboxdk/php-baseimages/php-cli:8.5-bookworm-dev-v1
    # The image entrypoint prints a banner to stdout and runs chown -R on /var/www/html,
    # which would rewrite ownership of the bind-mounted repo. This container is a toolbox,
    # so it runs commands directly under tini.
    entrypoint: []
    init: true
    command: ["sleep", "infinity"]
    # The host user, never root: files written into the bind mount belong to the developer on
    # Linux, and the tests of unwritable files run instead of skipping, because root ignores
    # file permissions and gate 5 fails a skipped test. `composer services:up` exports CMS_UID
    # and CMS_GID from `id -u` and `id -g`; 1000 is the first user of a Linux host.
    user: "${CMS_UID:-1000}:${CMS_GID:-1000}"
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
      # allow_url_fopen = Off, as the runtime contract says. PHP reads conf.d in name order, so
      # zz-cms.ini comes after the image's 99-cbox.ini, which turns it on. A single file, so the
      # image's own conf.d files stay.
      - ./docker/php/conf.d/cms.ini:/usr/local/etc/php/conf.d/zz-cms.ini:ro
    environment:
      # The host user has no entry in the image's /etc/passwd, so HOME would be /, which it
      # cannot write. Composer and npm keep their caches below HOME.
      HOME: /tmp
      # Service names and container ports. These win over the host ports in phpunit.xml,
      # because PHPUnit does not overwrite an environment variable that is already set.
      DB_HOST: postgres
      DB_PORT: "5432"
      REDIS_HOST: valkey
      REDIS_PORT: "6379"
      # Xdebug is loaded but off by default; run with -e XDEBUG_MODE=debug to step through code.
      XDEBUG_MODE: ${XDEBUG_MODE:-off}
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "php", "-r", "exit(extension_loaded('pdo_pgsql') && extension_loaded('redis') ? 0 : 1);"]
      interval: 5s
      timeout: 5s
      retries: 5

  postgres:
    # docker.io/library/postgres:18-trixie with cbox-init as PID 1; the postmaster runs as
    # postgres, uid 999, through the official entrypoint, so POSTGRES_* and initdb.d work as
    # upstream documents them.
    image: ghcr.io/cboxdk/postgres:18
    # cbox-init stops Postgres with a fast shutdown and escalates after 100 s; Docker's default
    # of 10 s would SIGKILL the shutdown checkpoint (db-baseimages README).
    stop_grace_period: 130s
    ports:
      - "127.0.0.1:54317:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
      # Read by docker/postgres/initdb.d/10-cms.sh. Development credentials only.
      CMS_DATABASES: cms cms_test
      CMS_SCHEMA: cms
      CMS_OWNER_ROLE: cms_owner
      CMS_OWNER_PASSWORD: cms_owner
      CMS_APP_ROLE: cms_app
      CMS_APP_PASSWORD: cms_app
      CMS_IDENTITY_ROLE: cms_identity
      CMS_IDENTITY_PASSWORD: cms_identity
      # The command budget in GUARDRAILS 4.1 and PRD 7.4.
      CMS_APP_TRANSACTION_TIMEOUT: 5s
      # Default database for psql inside the container, so `psql -U cms_owner` works without -d.
      PGDATABASE: cms
    volumes:
      # The image's data mount; the cluster is PGDATA=/var/lib/postgresql/18/docker below it.
      - postgres-data:/var/lib/postgresql
      # Server settings as a drop-in, read after the generated postgresql.conf.
      - ./docker/postgres/conf.d:/etc/postgresql/conf.d:ro
      - ./docker/postgres/initdb.d:/docker-entrypoint-initdb.d:ro
      - ./docker/postgres/sql:/cms-init:ro
    healthcheck:
      # The supervisor's readiness verdict: no client tools, and never a login to the database.
      test: ["CMD", "test", "-f", "/tmp/cbox-ready"]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 60s

  valkey:
    # The official Valkey 8 image on Alpine with cbox-init as PID 1, AOF on and the data in /data.
    image: ghcr.io/cboxdk/valkey:8
    # cbox-init runs SHUTDOWN SAVE before it stops Valkey and gives the stop 30 s; Docker's
    # default of 10 s would SIGKILL the save.
    stop_grace_period: 40s
    ports:
      - "127.0.0.1:63797:6379"
    volumes:
      - valkey-data:/data
    healthcheck:
      test: ["CMD", "test", "-f", "/tmp/cbox-ready"]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 30s

volumes:
  postgres-data:
  valkey-data:
