laravel: '@testbench'

# The providers of cboxdk/cms's extra.laravel.providers, then the workbench's. Testbench discovers
# the root package's providers only in its own CLI and caches the manifest in its skeleton, where a
# test or a Larastan boot can rebuild it without them, so the workbench registers them itself, in
# the CLI and in every test case (tests/Arch/ModulesTest.php keeps the list equal to composer.json).
providers:
  - Cbox\Cms\Core\CoreServiceProvider
  - Cbox\Cms\Http\HttpServiceProvider
  - Cbox\Cms\Cli\CliServiceProvider
  - Cbox\Cms\Generators\GeneratorsServiceProvider
  - Workbench\App\Providers\WorkbenchServiceProvider

migrations: false

# vendor/bin/testbench runs the workbench's console, which holds pgsql_owner and runs the
# migrations, so cms:doctor sees the maintenance process (docs/developers/doctor.md).
env:
  - CBOX_CMS_MAINTENANCE_PROCESS=true

workbench:
  start: '/'
  install: false
  discovers:
    web: true
    api: false
    commands: false
    components: false
    views: true
  build: []
  assets: []
  sync: []
