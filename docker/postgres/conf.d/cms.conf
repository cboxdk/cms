# Server settings of the Cbox CMS operating contract (PRD 4.2), for the postgres service of
# compose.yaml. ghcr.io/cboxdk/postgres reads /etc/postgresql/conf.d/*.conf after the
# postgresql.conf that initdb wrote, so these win over the generated values; ALTER SYSTEM still
# wins over both.
#
# The role settings, such as the app role's transaction_timeout, are not here: they belong to
# the roles and are set by docker/postgres/sql/roles.sql.

# No prepared transactions (PRD 4.2). It is also Postgres' default; it is set so the contract
# is visible, and cms:doctor checks it (postgres.prepared_transactions).
max_prepared_transactions = 0

# English server messages (PRD 4.2). The kernel reads the text of some errors, because the
# SQLSTATE alone does not tell them apart: "no partition of relation" (MissingPartitionMapper) and
# the FATAL of a refused login (cms:doctor). Errors before a login, such as a wrong password, use
# this server default; roles.sql also sets it on the roles, and cms:doctor checks it
# (postgres.lc_messages).
lc_messages = 'C'

# Settings of the development and test server only, not of the operating contract. CI starts its
# own server without this drop-in, and a production server keeps Postgres' defaults.
#
# Every checkout and worktree runs its Postgres suite on this one server at the same time. A suite
# locks every partition of a partitioned table it truncates or migrates, so the default lock table
# (64 per connection) runs out under that load with SQLSTATE 53200, out of shared memory.
max_locks_per_transaction = 256

# The parallel Pest workers of every checkout (one per CPU and suite), the merge queue's runs and the
# dev image's containers share this server; 100 connections ran out under that load with "connection
# to server failed" and event-runner timeouts in the Postgres suite (3 October 2026).
max_connections = 400

# The data here is test databases and the dev database, which composer dev:prepare rebuilds, so
# durability after a crash of the server is traded for speed: no flush per commit, and no forced
# checkpoint that syncs every file the suites touched (DROP DATABASE waited 50 to 91 s for it).
# A crash of the server can lose or corrupt these databases; drop the volume and run
# composer services:up and composer dev:prepare again.
fsync = off
synchronous_commit = off
full_page_writes = off
