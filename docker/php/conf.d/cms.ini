; PHP settings of the runtime contract for the php service of compose.yaml (PRD 4.2, GUARDRAILS 3).
; compose.yaml mounts this file read-only as /usr/local/etc/php/conf.d/zz-cms.ini. PHP reads the
; files of conf.d in name order, so zz-cms.ini comes after the image's 99-cbox.ini, which sets
; allow_url_fopen = On, and wins.
;
; allow_url_fopen = Off: outbound HTTP goes only through the egress gateway and its SSRF guard, so
; fopen, file, copy and the other file functions open no http:// or ftp:// URLs. cms:doctor checks
; it as php.allow_url_fopen. Composer downloads through the curl extension, which the setting does
; not affect.
allow_url_fopen = Off
